substitutions:
  _REGION: us-central1
  _SERVICE: tarpaulin-api
  _IMAGE: tarpaulin-api
  _CLIENT_ORIGIN: https://replace-with-frontend-domain.example

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/tarpaulin/${_IMAGE}:$SHORT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/tarpaulin/${_IMAGE}:$SHORT_SHA

  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/tarpaulin/${_IMAGE}:$SHORT_SHA
      - --platform
      - managed
      - --region
      - ${_REGION}
      - --no-allow-unauthenticated
      - --set-env-vars
      - CLIENT_ORIGIN=${_CLIENT_ORIGIN}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/tarpaulin/${_IMAGE}:$SHORT_SHA
